name: Release
on:
  push:
    branches:
      - main
    paths:
      - "**/package.json"
      - ".changeset/**"
      - ".github/workflows/release.yml"
env:
  # Bypass husky commit hook for CI
  HUSKY: 0
jobs:
  version:
    timeout-minutes: 8
    runs-on: ubuntu-latest
    steps:
      - name: checkout code repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Use Node
        uses: actions/setup-node@v3
        with:
          node-version: "24"

      - name: Cache pnpm modules
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-

      # pnpm version is read from the "packageManager" field of package.json
      - uses: pnpm/action-setup@v4
        with:
          run_install: |
            args: [--filter "@wbe/*"]

      - name: Set up NPM credentials
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create versions PR & prepare publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm ci:version
          publish: pnpm ci:publish
          # Messages
          commit: "chore(deploy): Release"
          title: "chore(deploy): Release"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.REPO_TOKEN }}
